spring:
  application:
    name: loan-underwriting-ai
  ai:
    model:
      # No AI provider is enabled unless a provider profile (local | openai) turns one on.
      # AiConfig refuses to start the app if exactly one isn't active.
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Expose only what you need. "*" is a security finding in any enterprise review.
        include: health,info
  endpoint:
    health:
      show-details: never
