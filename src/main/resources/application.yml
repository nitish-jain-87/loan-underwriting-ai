spring:
  application:
    name: loan-underwriting-ai
  ai:
    model:
      # No AI provider is enabled unless a provider profile (local | openai) turns one on.
      # AiConfig refuses to start the app if exactly one isn't active.
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    tools:
      limits:
        # Spring AI 2.0.1+ defaults: 40 calls per tool, 150 total, PER TURN. Far too loose for us.
        max-calls-per-tool-default: 3
        max-total-tool-calls: 5

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Expose only what you need. "*" is a security finding in any enterprise review.
        include: health,info
  endpoint:
    health:
      show-details: never
